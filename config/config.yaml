data:
  data_path : "data/raw.csv"
model:
  _target_ : src.models.architectures.aw_best.aw_best.AW_Best
  ckpt_path : "data/models/aw_best.ckpt"
  training_data_path : "data/raw.csv"
optimizer:
  _target_ : src.optimization.scipy.alghoritms.diff_ev.DiffEv
  _convert_: all
  start: [[40000.0, 1.0], [50000.0, 1.0], [60000.0, 1.0], [65000.0, 1.0], [70000.0, 1.0]]
  boundaries:
    _target_: src.schemas.boundaries.Boundaries
    min_interval : 2400 #4h
    max_interval : 72000 #5d
    min_single_dose : 0.0
    max_single_dose : 2.5
    max_total_dose : 10
    max_total_time : 72000 #5d
    max_n_doses : 5
    safety_eps : 1e-3 #makes bounds stricter for the time of optimization
simulation: 
  params_file : "/content/EMT6-Ro/data/default-parameters.json"
  tumor_file : "/content/EMT6-Ro/data/test_tumor.txt"
